name: Lint Migrations

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: lint-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint migration files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run lint-migrations
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/lint-migrations.js --changed-only
